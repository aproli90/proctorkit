# Publishes to npm when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# Needs the repository secret NPM_TOKEN (an npm granular access token with publish rights for "proctorkit").
name: Publish to npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # npm provenance: the package page shows it was built from this repo
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
