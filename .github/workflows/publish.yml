# Stages a release on npm when a version tag (v0.1.1, v0.2.0, ...) is pushed. Nothing is public until a maintainer
# approves it on npmjs.com > Staged Packages, with two-factor authentication.
# Uses npm trusted publishing: npm trusts this workflow in this repo, so no token or secret is stored anywhere.
# Set up once on npmjs.com: package proctorkit > Settings > Trusted publisher > GitHub Actions,
# owner aproli90, repository proctorkit, workflow publish.yml, with "Allow npm publish" left off.
name: Publish to npm
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # to create the GitHub release for the tag
  id-token: write   # lets npm verify this run came from this workflow; also adds provenance to the package page
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24          # ships an npm new enough for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # npm stage needs npm 11.15 or later
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --access public
      - name: GitHub release with this version's changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
