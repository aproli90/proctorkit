<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProctorKit basic example</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #17201c; background: #f6f4ee; }
  button { font: inherit; padding: 8px 16px; }
  textarea { width: 100%; height: 96px; font: inherit; }
  pre { background: #ebe8df; padding: 12px; overflow: auto; max-height: 280px; font-size: 12px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Sample quiz</h1>
<p id="intro">This page shows ProctorKit with no backend. Events are printed below.</p>
<button id="begin">Begin</button>

<section id="quiz" hidden>
  <h2 id="qtitle">Question 1</h2>
  <p>Name one sign of a rotator cuff injury.</p>
  <textarea id="answer"></textarea>
  <p><button id="next">Next question</button> <button id="finish">Finish</button></p>
</section>

<h3>Event log</h3>
<pre id="log"></pre>

<!-- Build first with `npm run build`, or load from a CDN: https://cdn.jsdelivr.net/npm/proctorkit/dist/proctorkit.global.js -->
<script src="../dist/proctorkit.global.js"></script>
<script>
  const log = document.querySelector('#log');
  let q = 1;
  const proctor = ProctorKit.createProctor({
    consent: { organisation: 'Acme Hiring', retentionDays: 90 },
    context: { candidateId: 'demo-candidate', testId: 'sample-quiz' },
    onEvent: (e) => { log.textContent = `${String(e.ms).padStart(6)} ms  ${e.severity.padEnd(4)}  ${e.type}  ${JSON.stringify(e.data || {})}\n` + log.textContent; },
    onClip: (c) => { /* store c.mp4 (a half-minute stretch of the session video) yourself, or pass a key */ },
    onSnapshot: (s) => { /* optional: store s.dataUrl, a photo about every 10 s */ },
  });

  document.querySelector('#begin').onclick = async () => {
    const result = await proctor.runChecks();
    if (!result.ok) return;
    document.querySelector('#begin').hidden = true;
    document.querySelector('#quiz').hidden = false;
    proctor.setContext({ questionId: 'Q01' });
    proctor.start();
  };
  document.querySelector('#next').onclick = () => {
    q++;
    document.querySelector('#qtitle').textContent = `Question ${q}`;
    proctor.setContext({ questionId: 'Q' + String(q).padStart(2, '0') });
  };
  document.querySelector('#finish').onclick = () => {
    const report = proctor.stop();
    document.querySelector('#quiz').hidden = true;
    log.textContent = JSON.stringify({ ...report, events: `${report.events.length} events` }, null, 2);
  };
</script>
</body>
</html>
